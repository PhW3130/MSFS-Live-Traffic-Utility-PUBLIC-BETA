; ============================================================================
; ltu_collector.example.ini -> als "ltu_collector.ini" NEBEN ltu_collector.exe
; ============================================================================
; Ohne diese optionale Datei startet der Collector mit den eingebauten Defaults
; und sammelt NUR aktuell angefragte Client-Bereiche. Gibt es 20 s lang keine
; Traffic-Abfrage eines Clients, pausieren alle Upstream-Abfragen.
;
; Format: eine Einstellung pro Zeile key=wert
; ';' oder '#' am Zeilenanfang = Kommentar (keine Inline-Kommentare).
; CLI-Argumente (--url/--token/--interval/--region) haben Vorrang.

; URL der Webseite (index.php):
url=http://dnd.59-seconds.com/ltu/index.php

; Muss EXAKT dem LTU_TOKEN in index.php entsprechen (sonst 401):
token=CHANGE-ME-BITTE

; Sekunden zwischen Nachfrage-Abfragen beim Proxy (Default: 5).
; Upstream-Regionalabfragen werden feedweit auf mindestens 1 Request/s gedrosselt.
interval=5

; Optionaler OpenSky OAuth2-Client NUR auf diesem Collector-PC.
; Zugangsdaten einmalig in credentials.json neben der EXE eintragen.
; OpenSky ist die dritte regionale Quelle nach adsb.lol und adsb.fi und wird
; bei aktivem Client-Bereich mit begrenztem /states/all-Aufruf verwendet
; (mind. 120 s, persistente Obergrenze 700 Versuche je rollierende 24 h).
opensky_interval=120
opensky_credentials=credentials.json

; Optionale vierte regionale Quelle. PlaneTrack wird erst nach OpenSky versucht.
; API-Key nur lokal beim Collector ablegen: planetrack_credentials.example.json
; nach planetrack_credentials.json kopieren, Wert eintragen, Dateirechte begrenzen.
; Der Key wird weder an Clients gesendet noch in Proxy-Status gespeichert.
planetrack_credentials=planetrack_credentials.json

; Optional: Allowlist fuer Client-Bereiche (Format LAT,LON,RADIUS-KM, wiederholbar).
; Diese Eintraege starten selbst KEINE Abfragen; ein Client muss dort aktuell
; Traffic anfordern. Ohne region= werden alle aktiven Client-Bereiche bedient.
;region=50.03,8.57,250
;region=52.52,13.40,250
